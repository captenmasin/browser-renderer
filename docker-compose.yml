services:
  render:
    build: .
    image: browser-renderer:latest
    container_name: browser-renderer
    restart: always
    ports:
      # Bind to all interfaces; lock down via Ploi/UFW + token auth.
      # If using a reverse proxy on the same host, change to "127.0.0.1:3000:3000".
      - "3000:3000"
    env_file: .env
    environment:
      MAX_CONCURRENT: ${MAX_CONCURRENT:-40}
      NAV_TIMEOUT_MS: ${NAV_TIMEOUT_MS:-30000}
      BROWSER_MAX_RENDERS: ${BROWSER_MAX_RENDERS:-1000}
      BROWSER_MAX_AGE_MS: ${BROWSER_MAX_AGE_MS:-3600000}
    shm_size: '2gb'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 35s
    deploy:
      resources:
        limits:
          memory: 28G
