services:
  render:
    build: .
    restart: always
    ports:
      - "127.0.0.1:3000:3000"  # bind localhost only; expose via tunnel/private net
    environment:
      RENDER_TOKEN: ${RENDER_TOKEN}
      MAX_CONCURRENT: 40
    shm_size: '2gb'           # bigger /dev/shm for chromium
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    deploy:
      resources:
        limits:
          memory: 28G          # leave headroom on 32GB box
